services:
  db:
    image: postgres:16-alpine
    container_name: smart-campus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
      POSTGRES_DB: smart_campus
    ports:
      - "5436:5432"
    volumes:
      - smart_campus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smart_campus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: smart-campus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://smartcampus:smartcampus@db:5432/smart_campus?schema=public
      API_HOST: 0.0.0.0
      API_PORT: 4100
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4100:4100"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: smart-campus-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  smart_campus_pg:
