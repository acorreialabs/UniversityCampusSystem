# Render Blueprint — Smart Campus Core (Neon + Render, plano gratuito)
#
# Pré-requisito: base PostgreSQL gratuita em https://neon.tech
# Guia completo: docs/deploy-gratuito.md
#
# Deploy: https://render.com/deploy?repo=https://github.com/armandocorreia/UniversityCampusSystem
# Setup BD: npm run provision:deploy (Neon) → colar DATABASE_URL no Render.

services:
  - type: web
    name: smart-campus-api
    runtime: node
    plan: free
    buildCommand: bash .scripts/render-build-api.sh
    startCommand: bash .scripts/render-start-api.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: smart-campus-web
          property: host
      - key: LOG_LEVEL
        value: info

  - type: web
    name: smart-campus-web
    runtime: static
    buildCommand: bash .scripts/render-build-web.sh
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_PUBLIC_HOST
        fromService:
          type: web
          name: smart-campus-api
          property: host
