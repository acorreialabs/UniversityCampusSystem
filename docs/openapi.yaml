            id:
              type: string
            title:
              type: string
            startsAt:
              type: string
              format: date-time
            endsAt:
              type: string
              format: date-time
            subject:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                code:
                  type: string
                name:
                  type: string
            course:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                code:
                  type: string
                name:
                  type: string
        entries:
          type: array
