        '404':
          description: Estudante não encontrado
  /students/{id}/final-grades:
    get:
      tags:
      - Assessments
      summary: Nota final ponderada por disciplina
      description: 'Roles STUDENT (apenas o próprio), TEACHER (apenas estudantes cujas notas lançou),

        COORDINATOR, ADMIN.

        Admissão = Σ(valuePercent × weight) / Σ(weight) sobre as avaliações contínuas com nota.

        Com exame/recorrência: `finalGrade` = (admissão + exame) / 2; sem exame: admissão.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identificador do perfil do estudante (StudentProfile)
      responses:
        '200':
          description: Notas finais por disciplina
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinalGradeDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Não autenticado
        '403':
          description: Anti-BOLA — acesso a dados de outro utilizador
        '404':
          description: Estudante não encontrado
  /results:
    get:
      tags:
      - Assessments
      summary: Resultados de avaliação (contrato G3)
      description: 'Roles STUDENT, TEACHER, COORDINATOR, ADMIN.

        STUDENT: apenas os próprios resultados; `?studentId` de outro estudante → 403 (anti-BOLA).

        TEACHER: apenas resultados das avaliações que criou.

        COORDINATOR/ADMIN: todos; `?studentId` (StudentProfile.id) filtra por estudante (404 se não existir).

        A resposta identifica o estudante por `studentProfileId` e `studentUserId`.

        '
      parameters:
      - in: query
        name: studentId
        required: false
        schema:
          type: string
        description: 'StudentProfile.id (STUDENT: apenas o próprio)'
      responses:
        '200':
          description: Lista de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Não autenticado
        '403':
          description: Anti-BOLA ou role sem permissão (TECHNICIAN)
        '404':
          description: Estudante não encontrado
    post:
      tags:
      - Assessments
      summary: Criar/atualizar um resultado (contrato G3)
      description: 'Role TEACHER **atribuído à disciplina** da avaliação (ClassSchedule) —

        exclusivo do docente da respectiva disciplina.

        `studentId` no pedido é um StudentProfile.id; a resposta devolve também

        `studentUserId` (User.id) resolvido. Upsert por (assessmentId, studentId).

        Estudante DISPENSADO em exame/recorrência → 409 STUDENT_DISPENSADO.

        Nota fora do intervalo → 400 INVALID_GRADE_VALUE.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResultRequest'
      responses:
        '201':
          description: Resultado criado/atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ResultDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Nota inválida ou payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão ou não é o dono (anti-BOLA)
        '404':
          description: Avaliação ou estudante não encontrado
        '409':
          description: STUDENT_COURSE_MISMATCH ou STUDENT_DISPENSADO — estudante fora do curso ou dispensado em exame/recorrência
  /schedules:
    get:
      tags:
      - Schedules
      summary: Horários lectivos (contrato G3)
      description: 'Roles STUDENT, TEACHER, COORDINATOR, ADMIN.

        STUDENT: sessões do próprio curso; `?studentId` de outro estudante → 403 (anti-BOLA).

        TEACHER: sessões onde é docente.

        COORDINATOR/ADMIN: todas; `?studentId` resolve o curso do estudante (404 se não existir).

        Os filtros opcionais apenas restringem o resultado, nunca ampliam o acesso.

        '
      parameters:
      - in: query
        name: studentId
        required: false
        schema:
          type: string
        description: 'StudentProfile.id (STUDENT: apenas o próprio)'
      - in: query
        name: courseId
        required: false
        schema:
          type: string
      - in: query
        name: subjectId
        required: false
        schema:
          type: string
      - in: query
        name: teacherId
        required: false
        schema:
          type: string
      - in: query
        name: roomId
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
        description: Sessões com startsAt maior ou igual a este instante.
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
        description: Sessões com startsAt menor ou igual a este instante.
      responses:
        '200':
          description: Lista de horários
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Não autenticado
        '403':
          description: Anti-BOLA ou role sem permissão (TECHNICIAN)
        '404':
          description: Estudante não encontrado
    post:
      tags:
      - Schedules
      summary: Criar sessão de horário
      description: 'Roles COORDINATOR, ADMIN (matriz de roles do contrato G3).

        Valida disciplina/curso coerentes (409 SUBJECT_COURSE_MISMATCH), docente com role

        TEACHER (409 TEACHER_ROLE_MISMATCH), sala existente e `endsAt > startsAt`.

