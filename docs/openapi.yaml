openapi: 3.0.3
info:
  title: Smart Campus Core API
  version: 1.0.0
  description: 'API REST versionada do **Smart Campus Core** (UJAC / PTP III).


    ## Como autenticar no Swagger

    1. Execute `POST /auth/login` com um utilizador demo.

    2. Copie `data.tokens.accessToken`.

    3. Clique em **Authorize** e cole o token (ou `Bearer <token>`).

    4. Teste os endpoints protegidos.


    ## Credenciais demo

    - ADMIN: `admin@smartcampus.demo` / `Admin123!`

    - COORDINATOR: `coordenador@smartcampus.demo` / `Coord123!`

    - TEACHER: `docente@smartcampus.demo` / `Docente123!`

    - TECHNICIAN: `tecnico@smartcampus.demo` / `Tecnico123!`

    - STUDENT: `estudante@smartcampus.demo` / `Estudante123!`


    Manual completo: `docs/manual-apis-core.md`

    '
  contact:
    name: Smart Campus Core / PTP III
servers:
- url: http://localhost:4100/api/v1
  description: Desenvolvimento local
tags:
- name: Health
  description: Saúde do serviço (ver também GET /health fora de /api/v1)
- name: Auth
  description: Login, refresh e logout
- name: Users
  description: Perfil e gestão de utilizadores
- name: Rooms
  description: Edifícios e salas
- name: Buildings
  description: Cadastro de edifícios (Grupo Infraestrutura)
- name: Laboratories
  description: Laboratórios (Grupo Infraestrutura)
- name: Equipment
  description: Inventário de equipamentos (Grupo Infraestrutura)
- name: Incidents
  description: Ocorrências e estados
- name: Dashboard
  description: Indicadores agregados
- name: Audit
  description: Eventos de auditoria
- name: IoT
  description: Dispositivos, sensores e alertas
- name: Parking
  description: Parque, vagas e LPR
- name: Assessments
  description: Avaliações, notas (percentagem, pontos, escala), lançamento em bloco e notas finais ponderadas
- name: Schedules
  description: Horários lectivos (contrato G3 — Avaliações e Horários)
- name: Attendance
  description: Assiduidade — presenças, faltas, atrasos e justificações por sessão de horário
- name: Academic
  description: Departamentos, cursos e disciplinas (Gestão Académica)
- name: Financial
  description: 'Gestão financeira: STUDENT (dados próprios), FINANCE e ADMIN; políticas apenas ADMIN; salários editáveis apenas
    por FINANCE, ADMIN só consulta e imprime.'
- name: Students
  description: Perfis de estudantes (Gestão Académica)
- name: Teachers
  description: Perfis de docentes (Gestão Académica)
- name: Enrolments
  description: Inscrições de estudantes em disciplinas (Gestão Académica)
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - details
      - correlationId
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dados inválidos
        details:
          type: array
          items: {}
        correlationId:
          type: string
    Meta:
      type: object
      properties:
        correlationId:
          type: string
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum:
          - STUDENT
          - TEACHER
          - TECHNICIAN
          - COORDINATOR
          - ADMIN
        isActive:
          type: boolean
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
          example: 15m
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: admin@smartcampus.demo
        password:
          type: string
          format: password
          example: Admin123!
          minLength: 8
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    CreateUserRequest:
      type: object
      required:
      - email
      - password
      - fullName
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        role:
          type: string
          enum:
          - STUDENT
          - TEACHER
          - TECHNICIAN
          - COORDINATOR
          - ADMIN
    CreateRoomRequest:
      type: object
      required:
      - code
      - name
      - capacity
      - buildingId
      properties:
        code:
          type: string
          example: A-101
        name:
          type: string
          example: Sala de Aula 101
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
          example: 40
        floor:
          type: integer
          minimum: -5
          maximum: 100
          default: 0
        status:
          type: string
          enum:
          - AVAILABLE
          - OCCUPIED
          - MAINTENANCE
          - RESERVED
        buildingId:
          type: string
    CreateDeviceRequest:
      type: object
      required:
      - code
      - name
      - type
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
          example: TEMP-A-01
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Sensor de temperatura A
        type:
          type: string
          minLength: 2
          maxLength: 60
          example: sensor
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - MAINTENANCE
          - UNKNOWN
          description: Opcional. Por omissão UNKNOWN.
        roomId:
          type: string
          nullable: true
        mqttTopic:
          type: string
          maxLength: 200
          nullable: true
    RoomDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        capacity:
          type: integer
        floor:
          type: integer
        status:
          type: string
        building:
          type: object
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateBuildingRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          example: B-01
        name:
          type: string
          example: Edifício Central
        description:
          type: string
          nullable: true
        floors:
          type: integer
          minimum: 0
          maximum: 200
          default: 1
    BuildingDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        floors:
          type: integer
        roomsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLaboratoryRequest:
      type: object
      required:
      - code
      - name
      - buildingId
      properties:
        code:
          type: string
          example: L-01
        name:
          type: string
          example: Laboratório de Redes
        description:
          type: string
          nullable: true
        buildingId:
          type: string
    LaboratoryDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        buildingId:
          type: string
        building:
          type: object
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateEquipmentRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          example: EQ-01
        name:
          type: string
          example: Projetor Epson
        description:
          type: string
          nullable: true
        roomId:
          type: string
          nullable: true
        laboratoryId:
          type: string
          nullable: true
    EquipmentDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        roomId:
          type: string
          nullable: true
        laboratoryId:
          type: string
          nullable: true
        room:
          type: object
          nullable: true
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        laboratory:
          type: object
          nullable: true
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateIncidentRequest:
      type: object
      required:
      - title
      - description
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
          example: Projector sem imagem
        description:
          type: string
          minLength: 5
          maxLength: 2000
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          default: MEDIUM
        roomId:
          type: string
          nullable: true
        equipmentId:
          type: string
          nullable: true
    UpdateIncidentStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
          - CLOSED
        notes:
          type: string
          maxLength: 1000
        assigneeId:
          type: string
          nullable: true
    IncidentDto:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        roomId:
          type: string
          nullable: true
        reporterId:
          type: string
        assigneeId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePlateReadingRequest:
      type: object
      required:
      - lotId
      - plate
      - direction
      properties:
        lotId:
          type: string
        plate:
          type: string
          description: Matrícula MZ — AXX 123 MP|MC (começa por A) ou legado AAA 12 34
          example: AIT 954 MC
        direction:
          type: string
          enum:
          - IN
          - OUT
        sensorCode:
          type: string
          default: CAM-LPR-SIM
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.9
        photoUrl:
          type: string
          format: uri
          nullable: true
        spotCode:
          type: string
          nullable: true
    UpdateParkingSpotRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - FREE
          - OCCUPIED
          - RESERVED
          - OUT_OF_SERVICE
        plate:
          type: string
          nullable: true
    CreateAssessmentRequest:
      type: object
      required:
      - title
      - subjectId
      - weight
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
          example: Teste 1 — Redes
        description:
          type: string
          maxLength: 2000
          nullable: true
        subjectId:
          type: string
          description: Identificador da disciplina (Subject) a que a avaliação pertence
        type:
          type: string
          enum:
          - TEST
          - EXAM
          - ASSIGNMENT
          - PRACTICAL
          - ORAL
          - OTHER
          default: TEST
          description: Tipo de avaliação — TEST é o teste criado pelo docente
        gradingMode:
          type: string
          enum:
          - PERCENTAGE
          - POINTS
          - SCALE
          default: PERCENTAGE
          description: 'Modo de lançamento da nota:

            - PERCENTAGE: valor 0–100 (%)

            - POINTS: valor aritmético 0–maxScore (pontos)

            - SCALE: valor 0–20 (escala clássica)

            '
        maxScore:
          type: number
          default: 20
          description: Escala máxima usada no modo POINTS
        weight:
          type: number
          minimum: 0.1
          maximum: 100
          example: 40
          description: Peso da avaliação na nota final — escolhido pelo docente
        date:
          type: string
          format: date-time
          nullable: true
    UpdateAssessmentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          maxLength: 2000
          nullable: true
        type:
          type: string
          enum:
          - TEST
          - EXAM
          - ASSIGNMENT
          - PRACTICAL
          - ORAL
          - OTHER
        gradingMode:
          type: string
          enum:
          - PERCENTAGE
          - POINTS
          - SCALE
        maxScore:
          type: number
        weight:
          type: number
          minimum: 0.1
          maximum: 100
        date:
          type: string
          format: date-time
          nullable: true
    UpsertGradesRequest:
      type: object
      required:
      - grades
      properties:
        grades:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required:
            - studentId
            - value
            properties:
              studentId:
                type: string
                description: Identificador do perfil (StudentProfile) do estudante avaliado
              value:
                type: number
                description: Nota no modo de lançamento da avaliação (%, pontos ou escala)
                example: 16
              comment:
                type: string
                maxLength: 500
                nullable: true
    AssessmentDto:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum:
          - TEST
          - EXAM
          - ASSIGNMENT
          - PRACTICAL
          - ORAL
          - OTHER
        gradingMode:
          type: string
          enum:
          - PERCENTAGE
          - POINTS
          - SCALE
        maxScore:
          type: number
        weight:
          type: number
          description: Peso (0–100) escolhido pelo docente
        date:
          type: string
          format: date-time
          nullable: true
        subjectId:
          type: string
        subject:
          type: object
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GradeDto:
      type: object
      properties:
        id:
          type: string
        assessmentId:
          type: string
        studentId:
          type: string
        value:
          type: number
          description: Valor bruto lançado no modo da avaliação
        valuePercent:
          type: number
          description: Valor normalizado para 0–100 (base do cálculo ponderado)
        comment:
          type: string
          nullable: true
        gradedById:
          type: string
        student:
          type: object
          properties:
            id:
              type: string
            studentNumber:
              type: string
            fullName:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FinalGradeDto:
      type: object
      properties:
        subjectId:
          type: string
        subjectCode:
          type: string
        subjectName:
          type: string
        finalGrade:
          type: number
          nullable: true
          description: 'Nota final **inteira** (0–20), calculada automaticamente quando os pesos

            das avaliações contínuas da disciplina somam 100% (ou mais) e todas têm

            nota lançada; null caso contrário (em aberto).

            Com exame/recorrência: final = (admissão + exame) / 2; sem exame: admissão.

            '
        admissionGrade:
          type: number
          nullable: true
          description: Nota de admissão inteira (média das avaliações contínuas, 0–20).
        examGrade:
          type: number
          nullable: true
          description: Nota de exame/recorrência inteira (0–20), quando lançada.
        usedExam:
          type: boolean
          description: true quando o resultado final inclui exame/recorrência — (A+E)/2.
        status:
          type: string
          nullable: true
          enum:
          - EXCLUIDO
          - APROVADO
          - DISPENSADO
          - ADMITIDO_AO_EXAME
          description: 'Situação **legada** (mantida por compatibilidade): <=9 → EXCLUIDO,

            10–13 → APROVADO, >=14 (banda 13.5–20) → DISPENSADO,

            10–13 sem exame → ADMITIDO_AO_EXAME. Para o fluxo completo

            (dispensa → exame → recorrência) use `state`.

            '
        state:
          type: string
          enum:
          - PENDENTE
          - DISPENSADO
          - EXCLUIDO
          - ADMITIDO_AO_EXAME
          - APROVADO_EXAME
          - REPROVADO_EXAME
          - ADMITIDO_RECORRENCIA
          - APROVADO_RECORRENCIA
          - REPROVADO_RECORRENCIA
          - NAO_ELEGIVEL_RECORRENCIA
          - RECORRENCIA_EM_REVISAO
          description: 'Estado académico autoritativo (calculado no backend, nunca editável).

            PENDENTE (faltam notas/continuidade) → DISPENSADO (admissão arredondada

            >=14) | EXCLUIDO (admissão <10) | ADMITIDO_AO_EXAME (10–13 sem exame)

            → APROVADO_EXAME ((A+E)/2 >=10) | REPROVADO_EXAME (sem época de

            recorrência) | ADMITIDO_RECORRENCIA (admissão >= mínimo, por omissão 7)

            | NAO_ELEGIVEL_RECORRENCIA (admissão < mínimo) |

            APROVADO_RECORRENCIA | REPROVADO_RECORRENCIA |

            RECORRENCIA_EM_REVISAO (exame alterado depois da recorrência).

            `*` no frontend = APROVADO_EXAME (nunca guardado na BD).

            '
        stateReason:
          type: string
          nullable: true
          description: Explicação legível do estado (ex. "Frequência abaixo de 10").
        recurrenceEligible:
          type: boolean
          description: true quando o estado permite/admite a época de recorrência.
        complete:
          type: boolean
          description: true quando os pesos contínuos somam 100% (ou mais) e todas as avaliações contínuas têm nota lançada.
        totalWeight:
          type: number
        gradedAssessments:
          type: integer
        assessments:
          type: integer
        breakdown:
          type: array
          items:
            type: object
            properties:
              assessmentId:
                type: string
              title:
                type: string
              weight:
                type: number
              value:
                type: number
              valuePercent:
                type: number
    ResultDto:
      type: object
      description: 'Resultado de avaliação (contrato G3). Devolve as duas identidades resolvidas:

        studentProfileId (StudentProfile.id) e studentUserId (User.id).

        '
      properties:
        id:
          type: string
        assessmentId:
          type: string
        assessment:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            type:
              type: string
            gradingMode:
              type: string
              enum:
              - PERCENTAGE
              - POINTS
              - SCALE
            maxScore:
              type: number
            weight:
              type: number
            subjectId:
              type: string
            subject:
              type: object
              properties:
                id:
                  type: string
                code:
                  type: string
                name:
                  type: string
        studentProfileId:
          type: string
          description: StudentProfile.id
        studentUserId:
          type: string
          description: User.id resolvido pelo backend
        studentNumber:
          type: string
        value:
          type: number
        valuePercent:
          type: number
          description: Valor normalizado para 0–100
        comment:
          type: string
          nullable: true
        gradedById:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateResultRequest:
      type: object
      required:
      - assessmentId
      - studentId
      - value
      properties:
        assessmentId:
          type: string
        studentId:
          type: string
          description: StudentProfile.id do estudante avaliado
        value:
          type: number
          description: Nota no modo de lançamento da avaliação (%, pontos ou escala)
        comment:
          type: string
          maxLength: 500
          nullable: true
    ScheduleDto:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subjectId:
          type: string
        subject:
          type: object
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        courseId:
          type: string
        course:
          type: object
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        teacherId:
          type: string
          nullable: true
        teacher:
          type: object
          nullable: true
          properties:
            id:
              type: string
            fullName:
              type: string
        roomId:
          type: string
          nullable: true
        room:
          type: object
          nullable: true
          description: Sala resolvida a partir de roomId (ClassSchedule não tem relação Prisma).
          properties:
            id:
              type: string
            code:
              type: string
            name:
              type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScheduleOptions:
      type: object
      description: Dados de referência para o formulário de gestão de horários (COORDINATOR/ADMIN).
      properties:
        courses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              code:
                type: string
              name:
                type: string
        subjects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              code:
                type: string
              name:
                type: string
              courseId:
                type: string
        teachers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              fullName:
                type: string
        rooms:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              code:
                type: string
              name:
                type: string
    CreateScheduleRequest:
      type: object
      required:
      - title
      - subjectId
      - courseId
      - startsAt
      - endsAt
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        subjectId:
          type: string
        courseId:
          type: string
        teacherId:
          type: string
          nullable: true
          description: Utilizador com role TEACHER
        roomId:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Deve ser posterior a startsAt
    UpdateScheduleRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        subjectId:
          type: string
        courseId:
          type: string
        teacherId:
          type: string
          nullable: true
        roomId:
          type: string
          nullable: true
