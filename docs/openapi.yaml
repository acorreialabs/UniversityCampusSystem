      description: 'Roles TEACHER (disciplina leccionada), COORDINATOR, ADMIN. Pelo menos um campo.

        Quando a pauta está publicada, a escrita é bloqueada (409 RESULTS_PUBLISHED).

        Audita SUBJECT_RULES_UPDATE.

