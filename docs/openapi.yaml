        description: Identificador interno da dívida devolvido por POST /api/v1/financial/debts ou pela listagem; não usar
          o código DBT.
      responses:
        '200':
          description: Dívida encontrada e acesso autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessDebt'
              example:
                data:
                  id: debt_semana6
                  code: DBT-2026-006
                  studentId: usr_student_01
                  title: Propina de Outubro
                  description: Mensalidade de Engenharia Informática
                  amount: 3500
                  origin: TUITION_2026
                  dueDate: 2099-10-31 23:59:59+00:00
                  status: PENDENTE
                  createdAt: 2026-09-30 10:00:00+00:00
                  updatedAt: 2026-09-30 10:00:00+00:00
                meta:
                  correlationId: semana6-200
        '401':
          description: Token de acesso ou sessao invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: Token de acesso ou sessao invalida.
                correlationId: semana6-401
                details: []
        '403':
          description: Perfil sem permissão ou dívida de outro estudante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Perfil sem permissão ou dívida de outro estudante.
                correlationId: semana6-403
                details: []
        '404':
          description: Dívida não encontrada.
          content:
            application/json:
              schema:
