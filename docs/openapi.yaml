openapi: 3.0.3
info:
  title: Smart Campus Core API
  version: 1.0.0
  description: |
    API REST versionada do **Smart Campus Core** (UJAC / PTP III).

    ## Como autenticar no Swagger
    1. Execute `POST /auth/login` com um utilizador demo.
    2. Copie `data.tokens.accessToken`.
    3. Clique em **Authorize** e cole o token (ou `Bearer <token>`).
    4. Teste os endpoints protegidos.

    ## Credenciais demo
    - ADMIN: `admin@smartcampus.demo` / `Admin123!`
    - COORDINATOR: `coordenador@smartcampus.demo` / `Coord123!`
    - TEACHER: `docente@smartcampus.demo` / `Docente123!`
    - TECHNICIAN: `tecnico@smartcampus.demo` / `Tecnico123!`
    - STUDENT: `estudante@smartcampus.demo` / `Estudante123!`

    Manual completo: `docs/manual-apis-core.md`
  contact:
    name: Smart Campus Core / PTP III
servers:
  - url: http://localhost:4100/api/v1
    description: Desenvolvimento local
tags:
  - name: Health
    description: Saúde do serviço (ver também GET /health fora de /api/v1)
  - name: Auth
    description: Login, refresh e logout
  - name: Users
    description: Perfil e gestão de utilizadores
  - name: Rooms
    description: Edifícios e salas
  - name: Incidents
    description: Ocorrências e estados
  - name: Dashboard
    description: Indicadores agregados
  - name: Audit
    description: Eventos de auditoria
  - name: IoT
    description: Dispositivos, sensores e alertas
  - name: Parking
    description: Parque, vagas e LPR
  - name: Assessments
    description: Avaliações, notas (percentagem, pontos, escala), lançamento em bloco e notas finais ponderadas
  - name: Schedules
    description: Horários lectivos (contrato G3 — Avaliações e Horários)
  - name: Attendance
    description: Assiduidade — presenças, faltas, atrasos e justificações por sessão de horário
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message, details, correlationId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: Dados inválidos }
        details:
          type: array
          items: {}
        correlationId: { type: string }
    Meta:
      type: object
      properties:
        correlationId: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AuthUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role:
          type: string
          enum: [STUDENT, TEACHER, TECHNICIAN, COORDINATOR, ADMIN]
        isActive: { type: boolean }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, example: 15m }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@smartcampus.demo }
        password: { type: string, format: password, example: Admin123!, minLength: 8 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string }
    CreateUserRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        role:
          type: string
          enum: [STUDENT, TEACHER, TECHNICIAN, COORDINATOR, ADMIN]
    CreateRoomRequest:
      type: object
      required: [code, name, capacity, buildingId]
      properties:
        code: { type: string, example: A-101 }
        name: { type: string, example: Sala de Aula 101 }
        capacity: { type: integer, minimum: 1, maximum: 1000, example: 40 }
        floor: { type: integer, minimum: -5, maximum: 100, default: 0 }
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE, RESERVED]
        buildingId: { type: string }
    RoomDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        capacity: { type: integer }
        floor: { type: integer }
        status: { type: string }
        building:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateIncidentRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 3, maxLength: 160, example: Projector sem imagem }
        description: { type: string, minLength: 5, maxLength: 2000 }
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          default: MEDIUM
        roomId: { type: string, nullable: true }
        equipmentId: { type: string, nullable: true }
    UpdateIncidentStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
        notes: { type: string, maxLength: 1000 }
        assigneeId: { type: string, nullable: true }
    IncidentDto:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        priority: { type: string }
        roomId: { type: string, nullable: true }
        reporterId: { type: string }
        assigneeId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePlateReadingRequest:
      type: object
      required: [lotId, plate, direction]
      properties:
        lotId: { type: string }
        plate:
          type: string
          description: Matrícula MZ — AXX 123 MP|MC (começa por A) ou legado AAA 12 34
          example: AIT 954 MC
        direction:
          type: string
          enum: [IN, OUT]
        sensorCode: { type: string, default: CAM-LPR-SIM }
        confidence: { type: number, minimum: 0, maximum: 1, default: 0.9 }
        photoUrl: { type: string, format: uri, nullable: true }
        spotCode: { type: string, nullable: true }
    UpdateParkingSpotRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [FREE, OCCUPIED, RESERVED, OUT_OF_SERVICE]
        plate: { type: string, nullable: true }
    CreateAssessmentRequest:
      type: object
      required: [title, subjectId, weight]
      properties:
        title: { type: string, minLength: 3, maxLength: 160, example: Teste 1 — Redes }
        description: { type: string, maxLength: 2000, nullable: true }
        subjectId:
          type: string
          description: Identificador da disciplina (Subject) a que a avaliação pertence
        type:
          type: string
          enum: [TEST, EXAM, ASSIGNMENT, PRACTICAL, ORAL, OTHER]
          default: TEST
          description: Tipo de avaliação — TEST é o teste criado pelo docente
        gradingMode:
          type: string
          enum: [PERCENTAGE, POINTS, SCALE]
          default: PERCENTAGE
          description: |
            Modo de lançamento da nota:
            - PERCENTAGE: valor 0–100 (%)
            - POINTS: valor aritmético 0–maxScore (pontos)
            - SCALE: valor 0–20 (escala clássica)
        maxScore:
          type: number
          default: 20
          description: Escala máxima usada no modo POINTS
        weight:
          type: number
          minimum: 0.1
          maximum: 100
          example: 40
          description: Peso da avaliação na nota final — escolhido pelo docente
        date:
          type: string
          format: date-time
          nullable: true
    UpdateAssessmentRequest:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, maxLength: 2000, nullable: true }
        type:
          type: string
          enum: [TEST, EXAM, ASSIGNMENT, PRACTICAL, ORAL, OTHER]
        gradingMode:
          type: string
          enum: [PERCENTAGE, POINTS, SCALE]
        maxScore: { type: number }
        weight: { type: number, minimum: 0.1, maximum: 100 }
        date: { type: string, format: date-time, nullable: true }
    UpsertGradesRequest:
      type: object
      required: [grades]
      properties:
        grades:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [studentId, value]
            properties:
              studentId:
                type: string
                description: Identificador do perfil (StudentProfile) do estudante avaliado
              value:
                type: number
                description: Nota no modo de lançamento da avaliação (%, pontos ou escala)
                example: 16
              comment: { type: string, maxLength: 500, nullable: true }
    AssessmentDto:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        type: { type: string, enum: [TEST, EXAM, ASSIGNMENT, PRACTICAL, ORAL, OTHER] }
        gradingMode: { type: string, enum: [PERCENTAGE, POINTS, SCALE] }
        maxScore: { type: number }
        weight: { type: number, description: Peso (0–100) escolhido pelo docente }
        date: { type: string, format: date-time, nullable: true }
        subjectId: { type: string }
        subject:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GradeDto:
      type: object
      properties:
        id: { type: string }
        assessmentId: { type: string }
        studentId: { type: string }
        value: { type: number, description: Valor bruto lançado no modo da avaliação }
        valuePercent: { type: number, description: Valor normalizado para 0–100 (base do cálculo ponderado) }
        comment: { type: string, nullable: true }
        gradedById: { type: string }
        student:
          type: object
          properties:
            id: { type: string }
            studentNumber: { type: string }
            fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FinalGradeDto:
      type: object
      properties:
        subjectId: { type: string }
        subjectCode: { type: string }
        subjectName: { type: string }
        finalGrade:
          type: number
          nullable: true
          description: |
            Nota final **inteira** (0–20), calculada automaticamente quando os pesos
            das avaliações contínuas da disciplina somam 100% (ou mais) e todas têm
            nota lançada; null caso contrário (em aberto).
            Com exame/recorrência: final = (admissão + exame) / 2; sem exame: admissão.
        admissionGrade:
          type: number
          nullable: true
          description: Nota de admissão inteira (média das avaliações contínuas, 0–20).
        examGrade:
          type: number
          nullable: true
          description: Nota de exame/recorrência inteira (0–20), quando lançada.
        usedExam:
          type: boolean
          description: true quando o resultado final inclui exame/recorrência — (A+E)/2.
        status:
          type: string
          nullable: true
          enum: [EXCLUIDO, APROVADO, DISPENSADO, ADMITIDO_AO_EXAME]
          description: |
            Situação **legada** (mantida por compatibilidade): <=9 → EXCLUIDO,
            10–13 → APROVADO, >=14 (banda 13.5–20) → DISPENSADO,
            10–13 sem exame → ADMITIDO_AO_EXAME. Para o fluxo completo
            (dispensa → exame → recorrência) use `state`.
        state:
          type: string
          enum:
            [
              PENDENTE,
              DISPENSADO,
              EXCLUIDO,
              ADMITIDO_AO_EXAME,
              APROVADO_EXAME,
              REPROVADO_EXAME,
              ADMITIDO_RECORRENCIA,
              APROVADO_RECORRENCIA,
              REPROVADO_RECORRENCIA,
              NAO_ELEGIVEL_RECORRENCIA,
              RECORRENCIA_EM_REVISAO,
            ]
          description: |
            Estado académico autoritativo (calculado no backend, nunca editável).
            PENDENTE (faltam notas/continuidade) → DISPENSADO (admissão arredondada
            >=14) | EXCLUIDO (admissão <10) | ADMITIDO_AO_EXAME (10–13 sem exame)
            → APROVADO_EXAME ((A+E)/2 >=10) | REPROVADO_EXAME (sem época de
            recorrência) | ADMITIDO_RECORRENCIA (admissão >= mínimo, por omissão 7)
            | NAO_ELEGIVEL_RECORRENCIA (admissão < mínimo) |
            APROVADO_RECORRENCIA | REPROVADO_RECORRENCIA |
            RECORRENCIA_EM_REVISAO (exame alterado depois da recorrência).
            `*` no frontend = APROVADO_EXAME (nunca guardado na BD).
        stateReason: { type: string, nullable: true, description: Explicação legível do estado (ex. "Frequência abaixo de 10"). }
        recurrenceEligible:
          type: boolean
          description: true quando o estado permite/admite a época de recorrência.
        complete:
          type: boolean
          description: true quando os pesos contínuos somam 100% (ou mais) e todas as avaliações contínuas têm nota lançada.
        totalWeight: { type: number }
        gradedAssessments: { type: integer }
        assessments: { type: integer }
        breakdown:
          type: array
          items:
            type: object
            properties:
              assessmentId: { type: string }
              title: { type: string }
              weight: { type: number }
              value: { type: number }
              valuePercent: { type: number }
    ResultDto:
      type: object
      description: |
        Resultado de avaliação (contrato G3). Devolve as duas identidades resolvidas:
        studentProfileId (StudentProfile.id) e studentUserId (User.id).
      properties:
        id: { type: string }
        assessmentId: { type: string }
        assessment:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            type: { type: string }
            gradingMode: { type: string, enum: [PERCENTAGE, POINTS, SCALE] }
            maxScore: { type: number }
            weight: { type: number }
            subjectId: { type: string }
            subject:
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                name: { type: string }
        studentProfileId: { type: string, description: StudentProfile.id }
        studentUserId: { type: string, description: User.id resolvido pelo backend }
        studentNumber: { type: string }
        value: { type: number }
        valuePercent: { type: number, description: Valor normalizado para 0–100 }
        comment: { type: string, nullable: true }
        gradedById: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateResultRequest:
      type: object
      required: [assessmentId, studentId, value]
      properties:
        assessmentId: { type: string }
        studentId:
          type: string
          description: StudentProfile.id do estudante avaliado
        value:
          type: number
          description: Nota no modo de lançamento da avaliação (%, pontos ou escala)
        comment: { type: string, maxLength: 500, nullable: true }
    ScheduleDto:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subjectId: { type: string }
        subject:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        courseId: { type: string }
        course:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        teacherId: { type: string, nullable: true }
        teacher:
          type: object
          nullable: true
          properties:
            id: { type: string }
            fullName: { type: string }
        roomId: { type: string, nullable: true }
        room:
          type: object
          nullable: true
          description: Sala resolvida a partir de roomId (ClassSchedule não tem relação Prisma).
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScheduleOptions:
      type: object
      description: Dados de referência para o formulário de gestão de horários (COORDINATOR/ADMIN).
      properties:
        courses:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
        subjects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              courseId: { type: string }
        teachers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              fullName: { type: string }
        rooms:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
    CreateScheduleRequest:
      type: object
      required: [title, subjectId, courseId, startsAt, endsAt]
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        subjectId: { type: string }
        courseId: { type: string }
        teacherId: { type: string, nullable: true, description: Utilizador com role TEACHER }
        roomId: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Deve ser posterior a startsAt }
    UpdateScheduleRequest:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        subjectId: { type: string }
        courseId: { type: string }
        teacherId: { type: string, nullable: true }
        roomId: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, JUSTIFIED]
      description: 'Estado de assiduidade numa sessão de horário'
    AttendanceDto:
      type: object
      properties:
        id: { type: string }
        classScheduleId: { type: string }
        classSchedule:
          type: object
          nullable: true
          properties:
            id: { type: string }
            title: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
        studentProfileId: { type: string }
        student:
          type: object
          nullable: true
          properties:
            id: { type: string }
            studentNumber: { type: string }
            fullName: { type: string }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        note: { type: string, nullable: true }
        recordedById: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttendanceSummaryDto:
      type: object
      description: |
        Agregado de assiduidade por estudante. `attendanceRate = (PRESENT + LATE) / total`,
        ou seja, faltas e justificações não contam como presença.
      properties:
        studentProfileId: { type: string }
        studentNumber: { type: string }
        fullName: { type: string }
        present: { type: integer }
        absent: { type: integer }
        late: { type: integer }
        justified: { type: integer }
        total: { type: integer }
        attendanceRate: { type: number, description: 'Percentagem (0 a 100)' }
    AttendanceRoster:
      type: object
      description: Pauta de assiduidade de uma sessão de horário.
      properties:
        schedule:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            subject: { type: object, nullable: true, properties: { id: { type: string }, code: { type: string }, name: { type: string } } }
            course: { type: object, nullable: true, properties: { id: { type: string }, code: { type: string }, name: { type: string } } }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: StudentProfile.id }
              studentNumber: { type: string }
              fullName: { type: string }
              attendanceId: { type: string, nullable: true }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
              note: { type: string, nullable: true }
    MarkAttendanceRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 300
          items:
            type: object
            required: [studentId, status]
            properties:
              studentId: { type: string, description: StudentProfile.id }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
              note: { type: string, maxLength: 500, nullable: true }
    AssessmentOptions:
      type: object
      description: Dados de referência para criar avaliações (TEACHER, COORDINATOR, ADMIN).
      properties:
        subjects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              courseId: { type: string }
              recurrenceMinAdmission:
                type: number
                nullable: true
                description: Mínimo de admissão (0–20) para recorrência; null = default institucional (7).
              resultsPublishedAt:
                type: string
                format: date-time
                nullable: true
                description: Data de publicação dos resultados (null = pauta aberta a alterações).
    AssessmentRoster:
      type: object
      description: |
        Pauta de notas de uma avaliação: estudantes do curso da disciplina com a nota
        actual (se lançada). Exige a mesma autorização de gestão da avaliação.
      properties:
        assessment: { $ref: '#/components/schemas/AssessmentDto' }
        entries:
          type: array
          items:
            type: object
            properties:
              studentProfileId: { type: string }
              studentNumber: { type: string }
              fullName: { type: string }
              value: { type: number, nullable: true }
              valuePercent: { type: number, nullable: true }
              comment: { type: string, nullable: true }
              situacao:
                type: string
                nullable: true
                enum: [EXCLUIDO, APROVADO, DISPENSADO]
                description: |
                  Situação académica do estudante na disciplina (null/enquanto os
                  pesos contínuos não somarem 100% ou faltarem notas — "em aberto").
                  Estudante DISPENSADO não aceita nota de
                  exame/recorrência (409 STUDENT_DISPENSADO).
              state:
                type: string
                nullable: true
                description: Estado académico autoritativo (AcademicState) — o mesmo de FinalGradeDto.state.
    SubjectBoard:
      type: object
      description: |
        Quadro disciplinar (um por disciplina) para dispensa, exame normal e
        recorrência: regras configuradas, épocas activas, contadores por estado
        e uma linha por estudante com espaços de exame/recorrência.
      properties:
        rules:
          type: object
          properties:
            subjectId: { type: string }
            subjectCode: { type: string }
            subjectName: { type: string }
            requiredTestCount:
              type: integer
              nullable: true
              description: N.º de testes exigidos para acionar a situação; null = regra de 100% do peso.
            recurrenceMinAdmission:
              type: number
              nullable: true
              description: Mínimo de admissão (0–20) para recorrência; null = default institucional (7).
            rulesConfigured: { type: boolean, description: true quando requiredTestCount e recurrenceMinAdmission estão ambos preenchidos (exigido para publicar). }
            published: { type: boolean }
            publishedAt: { type: string, format: date-time, nullable: true }
            hasExamEpoch: { type: boolean }
            hasRecurrenceEpoch: { type: boolean }
        examAssessment: { type: object, nullable: true, properties: { id: { type: string }, title: { type: string }, gradingMode: { type: string }, maxScore: { type: number } } }
        recurrenceAssessment: { type: object, nullable: true, properties: { id: { type: string }, title: { type: string }, gradingMode: { type: string }, maxScore: { type: number } } }
        counters:
          type: object
          description: Contagem de estudantes por estado (total + cada AcademicState).
          properties:
            total: { type: integer }
            pendentes: { type: integer }
            dispensados: { type: integer }
            excluidos: { type: integer }
            admitidosExame: { type: integer }
            aprovadosExame: { type: integer }
            reprovadosExame: { type: integer }
            admitidosRecorrencia: { type: integer }
            elegiveisRecorrencia: { type: integer }
            aprovadosRecorrencia: { type: integer }
            reprovadosRecorrencia: { type: integer }
            naoElegiveis: { type: integer }
            emRevisao: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              studentProfileId: { type: string }
              studentNumber: { type: string }
              fullName: { type: string }
              continuous:
                type: array
                items:
                  type: object
                  properties:
                    assessmentId: { type: string }
                    title: { type: string }
                    weight: { type: number }
                    value: { type: number, nullable: true }
              admissionGrade: { type: number, nullable: true }
              admissionPercent: { type: number, nullable: true }
              complete: { type: boolean }
              state: { type: string, description: AcademicState calculado no backend. }
              stateReason: { type: string, nullable: true }
              status: { type: string, nullable: true, description: Situação legada (compatibilidade). }
              exam: { $ref: '#/components/schemas/ExamSlot' }
              recurrence: { $ref: '#/components/schemas/RecurrenceSlot' }
              finalGrade: { type: number, nullable: true }
              finalPercent: { type: number, nullable: true }
    ExamSlot:
      type: object
      description: Espaço de exame normal de um estudante.
      properties:
        assessmentId: { type: string, nullable: true }
        grade: { type: number, nullable: true }
        valuePercent: { type: number, nullable: true }
        comment: { type: string, nullable: true }
        editable: { type: boolean, description: false quando o estado impede lançamento (DISPENSADO/EXCLUIDO). }
        blockedReason: { type: string, nullable: true }
    RecurrenceSlot:
      type: object
      description: Espaço de recorrência de um estudante.
      properties:
        assessmentId: { type: string, nullable: true }
        grade: { type: number, nullable: true }
        valuePercent: { type: number, nullable: true }
        comment: { type: string, nullable: true }
        asterisk: { type: boolean, description: true quando APROVADO_EXAME (UI mostra `*`; nunca guardado na BD). }
        editable: { type: boolean, description: false quando o estado não admite recorrência. }
        blockedReason: { type: string, nullable: true }
    SetSubjectRulesRequest:
      type: object
      description: Regras por disciplina (ambos opcionais; pelo menos um).
      properties:
        requiredTestCount:
          type: integer
          minimum: 1
          maximum: 50
          nullable: true
          description: N.º de testes exigidos para acionar a situação; null aplica a regra de 100% do peso.
        recurrenceMinAdmission:
          type: number
          minimum: 0
          maximum: 20
          nullable: true
          description: Mínimo de admissão (0–20) para recorrência; null aplica o default institucional (7).
    PublishResultsRequest:
      type: object
      required: [published]
      properties:
        published:
          type: boolean
          description: true publica a pauta (bloqueia escrita); false reabre (reabre a escrita).
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Autenticar utilizador
      description: Devolve access JWT + refresh token. Não requer Authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login bem-sucedido
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Renovar tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Tokens renovados
        '401':
          description: Refresh inválido ou expirado
  /auth/logout:
    post:
      tags: [Auth]
      summary: Terminar sessão
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: Sessão terminada
  /me:
    get:
      tags: [Users]
      summary: Perfil do utilizador autenticado
      responses:
        '200':
          description: Perfil AuthUser
        '401':
          description: Não autenticado
  /users:
    get:
      tags: [Users]
      summary: Listar utilizadores
      description: Roles ADMIN e COORDINATOR.
      responses:
        '200':
          description: Lista de utilizadores
        '403':
          description: Sem permissão
    post:
      tags: [Users]
      summary: Criar utilizador
      description: Apenas ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Utilizador criado
        '403':
          description: Sem permissão
        '409':
          description: Email já existe
  /rooms:
    get:
      tags: [Rooms]
      summary: Listar salas
      responses:
        '200':
          description: Lista de salas
    post:
      tags: [Rooms]
      summary: Criar sala
      description: Roles ADMIN, COORDINATOR, TECHNICIAN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
      responses:
        '201':
          description: Sala criada
  /rooms/{id}:
    get:
      tags: [Rooms]
      summary: Obter sala
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RoomDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404':
          description: Não encontrada
  /buildings:
    get:
      tags: [Rooms]
      summary: Listar edifícios
      responses:
        '200':
          description: Lista de edifícios
  /incidents:
    get:
      tags: [Incidents]
      summary: Listar ocorrências
      responses:
        '200':
          description: Lista
    post:
      tags: [Incidents]
      summary: Criar ocorrência
      description: Qualquer utilizador autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentRequest' }
      responses:
        '201':
          description: Criada
  /incidents/{id}/status:
    patch:
      tags: [Incidents]
      summary: Actualizar estado da ocorrência
      description: Roles TECHNICIAN, COORDINATOR, ADMIN.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIncidentStatusRequest' }
      responses:
        '200':
          description: Actualizada
        '403':
          description: Sem permissão
        '404':
          description: Ocorrência não encontrada
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Resumo do dashboard
      responses:
        '200':
          description: Indicadores DashboardSummary
  /audit-events:
    get:
      tags: [Audit]
      summary: Eventos de auditoria
      description: Roles ADMIN e COORDINATOR.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Lista de eventos
        '403':
          description: Sem permissão
  /devices:
    get:
      tags: [IoT]
      summary: Listar dispositivos
      responses:
        '200':
          description: Dispositivos com sensores e sala
  /sensors/{id}/readings:
    get:
      tags: [IoT]
      summary: Leituras de um sensor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Até 100 leituras (pode incluir isDemo)
        '404':
          description: Sensor não encontrado
  /alerts:
    get:
      tags: [IoT]
      summary: Listar alertas
      responses:
        '200':
          description: Últimos alertas
  /parking/overview:
    get:
      tags: [Parking]
      summary: Resumo de parques e vagas
      responses:
        '200':
          description: Overview de estacionamento
  /parking/readings:
    get:
      tags: [Parking]
      summary: Leituras de matrícula LPR
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 30, maximum: 100 }
      responses:
        '200':
          description: Lista de leituras
    post:
      tags: [Parking]
      summary: Registar leitura de matrícula (sensor/câmara)
      description: |
        Roles TECHNICIAN, COORDINATOR, ADMIN.
        `IN` ocupa vaga livre; `OUT` liberta vaga com a matrícula.
        Matrículas MZ modernizadas começam por **A** (ex. AIT 954 MC).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlateReadingRequest' }
      responses:
        '201':
          description: Leitura criada
        '400':
          description: Matrícula ou payload inválido
        '403':
          description: Sem permissão
  /parking/spots/{id}:
    patch:
      tags: [Parking]
      summary: Actualizar estado de vaga
      description: Roles TECHNICIAN, COORDINATOR, ADMIN.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateParkingSpotRequest' }
      responses:
        '200':
          description: Vaga actualizada
        '404':
          description: Vaga não encontrada
  /assessments:
    get:
      tags: [Assessments]
      summary: Listar avaliações
      description: |
        Roles STUDENT, TEACHER, COORDINATOR, ADMIN (contrato G3).
        O estudante vê apenas as avaliações das disciplinas do seu curso;
        o docente vê apenas as que criou; coordenador e admin veem todas.
      responses:
        '200':
          description: Lista de avaliações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssessmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: Pedido sem token JWT válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Role sem permissão (TECHNICIAN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      tags: [Assessments]
      summary: Criar avaliação (exclusivo do docente da disciplina)
      description: |
        Role TEACHER, **atribuído à disciplina** via horário (`ClassSchedule.teacherId`).
        COORDINATOR/ADMIN e docentes fora da disciplina recebem 403.
        O docente escolhe o **peso** (`weight`) da avaliação na nota final e o modo de
        lançamento da nota (`gradingMode`: PERCENTAGE, POINTS ou SCALE).
        Tipos: TEST, EXAM (exame), ASSIGNMENT, PRACTICAL, ORAL, OTHER, RECURRENCE (recorrência).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssessmentRequest' }
      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssessmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Pedido sem token JWT válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Role sem permissão ou docente não atribuído à disciplina
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Disciplina (subjectId) inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /assessments/options:
    get:
      tags: [Assessments]
      summary: Disciplinas disponíveis para criar avaliações
      description: Roles TEACHER, COORDINATOR, ADMIN.
      responses:
        '200':
          description: Opções de avaliação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssessmentOptions' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão (STUDENT, TECHNICIAN) }
  /assessments/{id}/roster:
    get:
      tags: [Assessments]
      summary: Pauta de notas da avaliação (lançamento em bloco)
      description: |
        Roles TEACHER (apenas as que criou), COORDINATOR, ADMIN. Devolve os estudantes do
        curso da disciplina com a nota actual (se existir). Violação de posse → 403.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pauta da avaliação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssessmentRoster' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão ou avaliação de outro utilizador }
        '404': { description: Avaliação não encontrada }
  /assessments/subject/{subjectId}/board:
    get:
      tags: [Assessments]
      summary: Quadro académico da disciplina (dispensa, exame e recorrência)
      description: |
        Roles TEACHER (disciplina leccionada via ClassSchedule), COORDINATOR, ADMIN.
        Devolve regras, épocas, contadores por estado e uma linha por estudante com
        o estado calculado no backend (AcademicState). Violação de posse → 403.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quadro da disciplina
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubjectBoard' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão ou disciplina de outro docente }
        '404': { description: Disciplina não encontrada }
  /assessments/subject/{subjectId}/rules:
    patch:
      tags: [Assessments]
      summary: Definir regras da disciplina (testes exigidos e mínimo de recorrência)
      description: |
        Roles TEACHER (disciplina leccionada), COORDINATOR, ADMIN. Pelo menos um campo.
        Quando a pauta está publicada, a escrita é bloqueada (409 RESULTS_PUBLISHED).
        Audita SUBJECT_RULES_UPDATE.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSubjectRulesRequest' }
      responses:
        '200':
          description: Regras guardadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Corpo inválido (VALIDATION_ERROR / INVALID_RECURRENCE_MIN) }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão ou disciplina de outro docente }
        '404': { description: Disciplina não encontrada }
        '409': { description: Pauta publicada (RESULTS_PUBLISHED) ou sem alterações (NO_CHANGES) }
  /assessments/subject/{subjectId}/publish:
    post:
      tags: [Assessments]
      summary: Publicar ou reabrir resultados da disciplina
      description: |
        Roles TEACHER (disciplina leccionada), COORDINATOR, ADMIN. Exige regras
        configuradas (409 RULES_NOT_CONFIGURED). Publicar bloqueia lançamentos e
        alterações de regras/avaliações (409 RESULTS_PUBLISHED); reabrir volta a
        permitir. Audita RESULTS_PUBLISH / RESULTS_UNPUBLISH.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishResultsRequest' }
      responses:
        '200':
          description: Estado de publicação actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Corpo inválido }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão ou disciplina de outro docente }
        '404': { description: Disciplina não encontrada }
        '409': { description: Regras não configuradas (RULES_NOT_CONFIGURED) ou já no estado pedido (NO_CHANGES) }
  /assessments/subject/{subjectId}/exemptions:
    post:
      tags: [Assessments]
      summary: Dispensa manual de estudante na disciplina (ao critério do docente)
      description: |
        Roles TEACHER (disciplina leccionada), COORDINATOR, ADMIN. Dispensa
        imposta pelo docente/coordenacao sobrepoe a regra automatica
        (admissao >= 14): o estado do estudante passa a DISPENSADO
        ("Dispensado pelo docente"), sem exame nem recorrencia, e a nota final
        passa a ser apenas a admissao. Audita SUBJECT_EXEMPTION_SET /
        SUBJECT_EXEMPTION_REMOVED.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, exempted]
              properties:
                studentId: { type: string }
                exempted: { type: boolean, description: "true = dispensar; false = anular dispensa" }
                reason: { type: string, nullable: true, maxLength: 500 }
      responses:
        '200':
          description: Dispensa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subjectId: { type: string }
                      studentId: { type: string }
                      exempted: { type: boolean }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Corpo invalido }
        '401': { description: Nao autenticado }
        '403': { description: Role sem permissao ou disciplina de outro docente }
        '404': { description: Disciplina ou estudante nao encontrado }
        '409': { description: Estudante fora do curso (STUDENT_COURSE_MISMATCH) ou dispensa inexistente ao anular (EXEMPTION_NOT_FOUND) }

  /assessments/{id}:
    get:
      tags: [Assessments]
      summary: Obter avaliação
      description: Roles TEACHER (apenas as que criou), COORDINATOR, ADMIN. Violação de posse → 403.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Identificador da avaliação
      responses:
        '200':
          description: Avaliação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssessmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão ou não é o dono }
        '404': { description: Avaliação não encontrada }
    patch:
      tags: [Assessments]
      summary: Alterar avaliação (título, peso, modo, etc.)
      description: |
        Roles TEACHER (apenas as que criou), COORDINATOR, ADMIN.
        `gradingMode`/`maxScore` ficam bloqueados depois de existirem notas lançadas (409).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssessmentRequest' }
      responses:
        '200':
          description: Avaliação actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssessmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Dados inválidos }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão ou não é o dono (anti-BOLA) }
        '404': { description: Avaliação não encontrada }
        '409': { description: Regras de avaliação bloqueadas por notas existentes }
  /assessments/{id}/grades:
    get:
      tags: [Assessments]
      summary: Notas lançadas numa avaliação
      description: Roles TEACHER (apenas as que criou), COORDINATOR, ADMIN.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Identificador da avaliação
      responses:
        '200':
          description: Notas da avaliação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GradeDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão ou não é o dono }
        '404': { description: Avaliação não encontrada }
    post:
      tags: [Assessments]
      summary: Lançar/actualizar notas (upsert por estudante)
      description: |
        Role TEACHER **atribuído à disciplina** (ClassSchedule) — exclusivo do docente
        da respectiva disciplina; COORDINATOR/ADMIN recebem 403 no lançamento.
        A nota é validada contra o `gradingMode` e `maxScore` da avaliação e guardada
        normalizada em `valuePercent` (0–100) para o cálculo ponderado da nota final.
        Estudante fora do curso da disciplina → 409 STUDENT_COURSE_MISMATCH.
        Estudante DISPENSADO em exame/recorrência → 409 STUDENT_DISPENSADO.
        `value` fora do intervalo → 400 INVALID_GRADE_VALUE.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Identificador da avaliação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertGradesRequest' }
      responses:
        '201':
          description: Notas lançadas (lista actualizada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GradeDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Nota fora do intervalo ou payload inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão, docente fora da disciplina ou anti-BOLA }
        '404': { description: Avaliação ou estudante não encontrado }
        '409': { description: 'STUDENT_COURSE_MISMATCH ou STUDENT_DISPENSADO' }
  /my/grades:
    get:
      tags: [Assessments]
      summary: Notas do estudante autenticado
      description: Roles STUDENT — devolve apenas as próprias notas (posse garantida pelo serviço).
      responses:
        '200':
          description: Notas do próprio estudante
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GradeDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role não é STUDENT }
        '404': { description: Sem perfil de estudante }
  /my/final-grades:
    get:
      tags: [Assessments]
      summary: Notas finais por disciplina do estudante autenticado
      description: |
        Roles STUDENT — pauta final ponderada por disciplina (média das avaliações com peso),
        com detalhe (`breakdown`) das avaliações já lançadas.
      responses:
        '200':
          description: Notas finais por disciplina
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FinalGradeDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role não é STUDENT }
        '404': { description: Sem perfil de estudante ou sem curso atribuído }
  /students/{id}/grades:
    get:
      tags: [Assessments]
      summary: Notas de um estudante
      description: |
        Roles STUDENT (apenas o próprio), TEACHER (apenas estudantes cujas notas lançou),
        COORDINATOR, ADMIN. Violação de posse (anti-BOLA) → **403 FORBIDDEN**.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Identificador do perfil do estudante (StudentProfile)
      responses:
        '200':
          description: Notas do estudante
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GradeDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: 'Anti-BOLA — acesso a dados de outro utilizador' }
        '404': { description: Estudante não encontrado }
  /students/{id}/final-grades:
    get:
      tags: [Assessments]
      summary: Nota final ponderada por disciplina
      description: |
        Roles STUDENT (apenas o próprio), TEACHER (apenas estudantes cujas notas lançou),
        COORDINATOR, ADMIN.
        Admissão = Σ(valuePercent × weight) / Σ(weight) sobre as avaliações contínuas com nota.
        Com exame/recorrência: `finalGrade` = (admissão + exame) / 2; sem exame: admissão.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Identificador do perfil do estudante (StudentProfile)
      responses:
        '200':
          description: Notas finais por disciplina
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FinalGradeDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: 'Anti-BOLA — acesso a dados de outro utilizador' }
        '404': { description: Estudante não encontrado }
  /results:
    get:
      tags: [Assessments]
      summary: Resultados de avaliação (contrato G3)
      description: |
        Roles STUDENT, TEACHER, COORDINATOR, ADMIN.
        STUDENT: apenas os próprios resultados; `?studentId` de outro estudante → 403 (anti-BOLA).
        TEACHER: apenas resultados das avaliações que criou.
        COORDINATOR/ADMIN: todos; `?studentId` (StudentProfile.id) filtra por estudante (404 se não existir).
        A resposta identifica o estudante por `studentProfileId` e `studentUserId`.
      parameters:
        - in: query
          name: studentId
          required: false
          schema: { type: string }
          description: 'StudentProfile.id (STUDENT: apenas o próprio)'
      responses:
        '200':
          description: Lista de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResultDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: 'Anti-BOLA ou role sem permissão (TECHNICIAN)' }
        '404': { description: Estudante não encontrado }
    post:
      tags: [Assessments]
      summary: Criar/atualizar um resultado (contrato G3)
      description: |
        Role TEACHER **atribuído à disciplina** da avaliação (ClassSchedule) —
        exclusivo do docente da respectiva disciplina.
        `studentId` no pedido é um StudentProfile.id; a resposta devolve também
        `studentUserId` (User.id) resolvido. Upsert por (assessmentId, studentId).
        Estudante DISPENSADO em exame/recorrência → 409 STUDENT_DISPENSADO.
        Nota fora do intervalo → 400 INVALID_GRADE_VALUE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResultRequest' }
      responses:
        '201':
          description: Resultado criado/atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ResultDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Nota inválida ou payload inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão ou não é o dono (anti-BOLA) }
        '404': { description: Avaliação ou estudante não encontrado }
        '409': { description: 'STUDENT_COURSE_MISMATCH ou STUDENT_DISPENSADO — estudante fora do curso ou dispensado em exame/recorrência' }
  /schedules:
    get:
      tags: [Schedules]
      summary: Horários lectivos (contrato G3)
      description: |
        Roles STUDENT, TEACHER, COORDINATOR, ADMIN.
        STUDENT: sessões do próprio curso; `?studentId` de outro estudante → 403 (anti-BOLA).
        TEACHER: sessões onde é docente.
        COORDINATOR/ADMIN: todas; `?studentId` resolve o curso do estudante (404 se não existir).
        Os filtros opcionais apenas restringem o resultado, nunca ampliam o acesso.
      parameters:
        - in: query
          name: studentId
          required: false
          schema: { type: string }
          description: 'StudentProfile.id (STUDENT: apenas o próprio)'
        - in: query
          name: courseId
          required: false
          schema: { type: string }
        - in: query
          name: subjectId
          required: false
          schema: { type: string }
        - in: query
          name: teacherId
          required: false
          schema: { type: string }
        - in: query
          name: roomId
          required: false
          schema: { type: string }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
          description: Sessões com startsAt maior ou igual a este instante.
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
          description: Sessões com startsAt menor ou igual a este instante.
      responses:
        '200':
          description: Lista de horários
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: 'Anti-BOLA ou role sem permissão (TECHNICIAN)' }
        '404': { description: Estudante não encontrado }
    post:
      tags: [Schedules]
      summary: Criar sessão de horário
      description: |
        Roles COORDINATOR, ADMIN (matriz de roles do contrato G3).
        Valida disciplina/curso coerentes (409 SUBJECT_COURSE_MISMATCH), docente com role
        TEACHER (409 TEACHER_ROLE_MISMATCH), sala existente e `endsAt > startsAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleRequest' }
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduleDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Dados inválidos ou datas invertidas }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão (STUDENT, TEACHER, TECHNICIAN) }
        '404': { description: Disciplina, curso, docente ou sala não encontrado }
        '409': { description: Incoerência disciplina/curso ou role do docente }
  /schedules/options:
    get:
      tags: [Schedules]
      summary: Dados de referência para gestão de horários
      description: |
        Roles COORDINATOR, ADMIN. Devolve cursos, disciplinas, docentes (role TEACHER activos)
        e salas para preencher o formulário de gestão.
      responses:
        '200':
          description: Opções de horário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduleOptions' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão (STUDENT, TEACHER, TECHNICIAN) }
  /schedules/{id}:
    patch:
      tags: [Schedules]
      summary: Alterar sessão de horário
      description: Roles COORDINATOR, ADMIN. Validações idênticas ao POST.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateScheduleRequest' }
      responses:
        '200':
          description: Sessão atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduleDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Dados inválidos ou datas invertidas }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão }
        '404': { description: Horário, disciplina, curso, docente ou sala não encontrado }
        '409': { description: Incoerência disciplina/curso ou role do docente }
    delete:
      tags: [Schedules]
      summary: Eliminar sessão de horário
      description: Roles COORDINATOR, ADMIN. Registado na auditoria (SCHEDULE_DELETE).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sessão eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão }
        '404': { description: Horário não encontrado }
  /attendance:
    get:
      tags: [Attendance]
      summary: Consultar registos de assiduidade
      description: |
        Roles STUDENT (próprios registos), TEACHER (sessões que lecciona),
        COORDINATOR/ADMIN (todos). Filtros opcionais: `studentId`, `scheduleId`, `status`.
        Estudante a filtrar `studentId` de outro → 403 (anti-BOLA).
      parameters:
        - in: query
          name: studentId
          required: false
          schema: { type: string }
        - in: query
          name: scheduleId
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/AttendanceStatus' }
      responses:
        '200':
          description: Lista de registos de assiduidade
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Anti-BOLA ou role sem permissão (TECHNICIAN) }
        '404': { description: Estudante não encontrado }
  /attendance/summary:
    get:
      tags: [Attendance]
      summary: Resumo de assiduidade por estudante
      description: |
        Roles STUDENT (próprio), TEACHER (sessões que lecciona), COORDINATOR/ADMIN (todos).
        `attendanceRate = (PRESENT + LATE) / total`.
        Opcional `?studentId=` para filtrar (STUDENT só o próprio; COORD/ADMIN qualquer).
      parameters:
        - in: query
          name: studentId
          required: false
          schema: { type: string }
        - in: query
          name: scheduleId
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/AttendanceStatus' }
      responses:
        '200':
          description: Resumo por estudante
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceSummaryDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Anti-BOLA ou role sem permissão }
  /attendance/sessions:
    get:
      tags: [Attendance]
      summary: Sessões de horário disponíveis para registar assiduidade
      description: |
        Roles TEACHER (sessões onde é docente), COORDINATOR, ADMIN (todas).
        Devolve as sessões de horário (ScheduleDto) — reutiliza a lógica de listagem.
      responses:
        '200':
          description: Lista de sessões
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão (STUDENT, TECHNICIAN) }
  /attendance/sessions/{scheduleId}:
    get:
      tags: [Attendance]
      summary: Pauta de assiduidade de uma sessão
      description: |
        Roles TEACHER (sessões onde é docente), COORDINATOR, ADMIN.
        Devolve todos os estudantes do curso da sessão com o estado actual (ou null se não registado).
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pauta da sessão
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttendanceRoster' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão ou sessão de outro docente }
        '404': { description: Sessão não encontrada }
    post:
      tags: [Attendance]
      summary: Registar/actualizar assiduidade em bloco
      description: |
        Roles TEACHER (sessões onde é docente), COORDINATOR, ADMIN.
        Upsert por estudante (único por sessão+estudante). Estudante de outro curso → 409 STUDENT_COURSE_MISMATCH.
        Corpo: `records: [{studentId, status, note?}]` — `studentId` = StudentProfile.id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkAttendanceRequest' }
      responses:
        '200':
          description: Pauta actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttendanceRoster' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { description: Dados inválidos (lista vazia, estado inválido) }
        '401': { description: Não autenticado }
        '403': { description: Role sem permissão ou sessão de outro docente }
        '404': { description: Sessão ou estudante não encontrado }
        '409': { description: Estudante não pertence ao curso da sessão }
