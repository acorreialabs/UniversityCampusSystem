        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Sessão atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Dados inválidos ou datas invertidas
        '401':
          description: Não autenticado
        '403':
          description: Role sem permissão
        '404':
          description: Horário
          disciplina: null
          curso: null
          docente ou sala não encontrado: null
        '409':
          description: Incoerência disciplina/curso ou role do docente
    delete:
      tags:
      - Schedules
      summary: Eliminar sessão de horário
      description: Roles COORDINATOR, ADMIN. Registado na auditoria (SCHEDULE_DELETE).
