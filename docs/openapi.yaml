      description: Roles TEACHER (apenas as que criou), COORDINATOR, ADMIN.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identificador da avaliação
      responses:
        '200':
          description: Notas da avaliação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GradeDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão ou não é o dono
        '404':
          description: Avaliação não encontrada
    post:
      tags:
      - Assessments
      summary: Lançar/actualizar notas (upsert por estudante)
      description: 'Role TEACHER **atribuído à disciplina** (ClassSchedule) — exclusivo do docente

        da respectiva disciplina; COORDINATOR/ADMIN recebem 403 no lançamento.

        A nota é validada contra o `gradingMode` e `maxScore` da avaliação e guardada

        normalizada em `valuePercent` (0–100) para o cálculo ponderado da nota final.

        Estudante fora do curso da disciplina → 409 STUDENT_COURSE_MISMATCH.

        Estudante DISPENSADO em exame/recorrência → 409 STUDENT_DISPENSADO.

        `value` fora do intervalo → 400 INVALID_GRADE_VALUE.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identificador da avaliação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertGradesRequest'
      responses:
        '201':
          description: Notas lançadas (lista actualizada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GradeDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Nota fora do intervalo ou payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
          docente fora da disciplina ou anti-BOLA: null
        '404':
          description: Avaliação ou estudante não encontrado
        '409':
          description: STUDENT_COURSE_MISMATCH ou STUDENT_DISPENSADO
  /my/grades:
