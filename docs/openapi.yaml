                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Não autenticado
        '403':
          description: Role sem permissão (STUDENT
          TEACHER: null
          TECHNICIAN): null
  /schedules/{id}:
    patch:
      tags:
      - Schedules
      summary: Alterar sessão de horário
      description: Roles COORDINATOR, ADMIN. Validações idênticas ao POST.
      parameters:
