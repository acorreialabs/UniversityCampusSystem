              example:
                code: DEBT_NOT_FOUND
                message: Dívida não encontrada.
                correlationId: semana6-404
                details: []
        '429':
          description: Demasiados pedidos; consultar Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Erro interno do Core (INTERNAL_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
