        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Dados inválidos ou datas invertidas
        '401':
          description: Não autenticado
        '403':
          description: Role sem permissão (STUDENT
          TEACHER: null
          TECHNICIAN): null
        '404':
          description: Disciplina
          curso: null
          docente ou sala não encontrado: null
        '409':
          description: Incoerência disciplina/curso ou role do docente
  /schedules/options:
    get:
      tags:
