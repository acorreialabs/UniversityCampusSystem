                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubjectDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404':
          description: Curso não encontrado (COURSE_NOT_FOUND)
  /subjects:
    get:
      tags: [Academic]
      summary: Listar disciplinas
      description: Qualquer utilizador autenticado. Filtro opcional por curso.
      parameters:
        - in: query
          name: courseId
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Lista de disciplinas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubjectDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Academic]
      summary: Criar disciplina
      description: Roles ADMIN, COORDINATOR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubjectRequest' }
      responses:
        '201':
          description: Disciplina criada
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão
        '404':
          description: Curso não encontrado (COURSE_NOT_FOUND)
        '409':
          description: Código já existe (SUBJECT_CODE_EXISTS)