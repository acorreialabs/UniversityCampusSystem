    get:
      summary: 'Consultar Dívida Específica [RBAC: FINANCE/ADMIN ou STUDENT proprietario]'
      tags:
      - Financial
      security:
      - bearerAuth: []
      description: 'FINANCE e ADMIN consultam qualquer dívida. STUDENT consulta apenas a sua: outro proprietário devolve 403
        FORBIDDEN. Não recebe corpo nem parâmetros de query. Um identificador desconhecido devolve 404.'
      parameters:
      - name: id
        in: path
