  /incidents:
    get:
      tags:
      - Incidents
      summary: Listar ocorrências
      responses:
        '200':
          description: Lista
    post:
      tags:
      - Incidents
      summary: Criar ocorrência
      description: Qualquer utilizador autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Criada
  /incidents/{id}/status:
    patch:
      tags:
      - Incidents
      summary: Actualizar estado da ocorrência
      description: Roles TECHNICIAN, COORDINATOR, ADMIN.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentStatusRequest'
      responses:
        '200':
          description: Actualizada
        '403':
          description: Sem permissão
        '404':
          description: Ocorrência não encontrada
  /dashboard:
    get:
      tags:
      - Dashboard
      summary: Resumo do dashboard
      responses:
        '200':
          description: Indicadores DashboardSummary
  /audit-events:
    get:
      tags:
      - Audit
      summary: Eventos de auditoria
      description: Roles ADMIN e COORDINATOR.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Lista de eventos
        '403':
          description: Sem permissão
  /devices:
    get:
      tags:
      - IoT
      summary: Listar dispositivos
      responses:
        '200':
          description: Dispositivos com sensores e sala
    post:
      tags:
      - IoT
      summary: Criar dispositivo
      description: Roles ADMIN, COORDINATOR, TECHNICIAN. Regista o evento de auditoria DEVICE_CREATE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Dispositivo criado
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão para este role
        '404':
          description: Sala não encontrada (ROOM_NOT_FOUND)
        '409':
          description: Já existe um dispositivo com este código (DEVICE_CODE_TAKEN)
  /devices/{id}/status:
    patch:
      tags:
      - IoT
      summary: Alterar o estado de um dispositivo
      description: Roles ADMIN, COORDINATOR, TECHNICIAN. Idempotente. Uma passagem para OFFLINE, ou de OFFLINE para ONLINE,
        gera alerta e notificações. Regista o evento DEVICE_STATUS_UPDATE.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - ONLINE
                  - OFFLINE
                  - MAINTENANCE
                  - UNKNOWN
      responses:
        '200':
          description: Dispositivo com o novo estado
        '400':
          description: Estado inválido (VALIDATION_ERROR)
        '403':
          description: Sem permissão para este role
        '404':
          description: Dispositivo não encontrado (DEVICE_NOT_FOUND)
  /devices/{id}:
    delete:
      tags:
      - IoT
      summary: Eliminar dispositivo
      description: Roles ADMIN, COORDINATOR. Não elimina dispositivos ONLINE. Regista o evento DEVICE_DELETE.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dispositivo eliminado (devolve o id)
        '403':
          description: Sem permissão para este role
        '404':
          description: Dispositivo não encontrado (DEVICE_NOT_FOUND)
        '409':
          description: 'Dispositivo ONLINE (DEVICE_ONLINE): coloque-o em MAINTENANCE ou OFFLINE primeiro'
    get:
      tags:
      - IoT
      summary: Leituras de um sensor
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Até 100 leituras (pode incluir isDemo)
        '404':
          description: Sensor não encontrado
  /alerts:
    get:
      tags:
      - IoT
      summary: Listar alertas
      responses:
        '200':
          description: Últimos alertas
  /alerts/{id}/ack:
    patch:
      tags:
      - IoT
      summary: Confirmar alerta
      description: Roles ADMIN, COORDINATOR, TECHNICIAN. Operação idempotente, confirmar um alerta já confirmado devolve-o
        sem erro e sem nova auditoria. Regista o evento ALERT_ACK.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Alerta confirmado, com acknowledged a true
        '403':
          description: Sem permissão para este role
        '404':
          description: Alerta não encontrado (ALERT_NOT_FOUND)
  /notifications:
    get:
      tags:
      - IoT
      summary: Listar as minhas notificações
      description: Qualquer utilizador autenticado. Devolve só as notificações do próprio utilizador (até 50, da mais recente
        para a mais antiga).
      responses:
        '200':
          description: Notificações do utilizador autenticado
  /notifications/{id}/read:
    patch:
      tags:
      - IoT
      summary: Marcar notificação como lida
      description: Qualquer utilizador autenticado, apenas nas suas próprias notificações. Idempotente. Uma notificação de
        outro utilizador responde 404, igual a um id inexistente.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Notificação com readAt preenchido
        '404':
          description: Notificação não encontrada (NOTIFICATION_NOT_FOUND)
  /parking/overview:
    get:
      tags:
      - Parking
      summary: Resumo de parques e vagas
      responses:
        '200':
          description: Overview de estacionamento
  /parking/readings:
    get:
      tags:
      - Parking
      summary: Leituras de matrícula LPR
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 30
          maximum: 100
      responses:
        '200':
          description: Lista de leituras
    post:
      tags:
      - Parking
      summary: Registar leitura de matrícula (sensor/câmara)
      description: 'Roles TECHNICIAN, COORDINATOR, ADMIN.

        `IN` ocupa vaga livre; `OUT` liberta vaga com a matrícula.

        Matrículas MZ modernizadas começam por **A** (ex. AIT 954 MC).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlateReadingRequest'
      responses:
        '201':
          description: Leitura criada
        '400':
          description: Matrícula ou payload inválido
        '403':
          description: Sem permissão
  /parking/spots/{id}:
    patch:
      tags:
      - Parking
      summary: Actualizar estado de vaga
      description: Roles TECHNICIAN, COORDINATOR, ADMIN.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParkingSpotRequest'
      responses:
        '200':
          description: Vaga actualizada
        '404':
          description: Vaga não encontrada
  /assessments:
    get:
      tags:
      - Assessments
      summary: Listar avaliações
      description: 'Roles STUDENT, TEACHER, COORDINATOR, ADMIN (contrato G3).

        O estudante vê apenas as avaliações das disciplinas do seu curso;

        o docente vê apenas as que criou; coordenador e admin veem todas.

        '
      responses:
        '200':
          description: Lista de avaliações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssessmentDto'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Pedido sem token JWT válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Role sem permissão (TECHNICIAN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
