    AssessmentOptions:
      type: object
      description: Dados de referência para criar avaliações (TEACHER, COORDINATOR, ADMIN).
      properties:
        subjects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              code:
                type: string
              name:
                type: string
              courseId:
                type: string
              recurrenceMinAdmission:
                type: number
                nullable: true
                description: Mínimo de admissão (0–20) para recorrência; null = default institucional (7).
              resultsPublishedAt:
                type: string
                format: date-time
                nullable: true
                description: Data de publicação dos resultados (null = pauta aberta a alterações).
    AssessmentRoster:
      type: object
      description: 'Pauta de notas de uma avaliação: estudantes do curso da disciplina com a nota

        actual (se lançada). Exige a mesma autorização de gestão da avaliação.

        '
      properties:
        assessment:
          $ref: '#/components/schemas/AssessmentDto'
        entries:
          type: array
          items:
            type: object
            properties:
              studentProfileId:
                type: string
              studentNumber:
                type: string
              fullName:
                type: string
              value:
                type: number
                nullable: true
              valuePercent:
                type: number
                nullable: true
              comment:
                type: string
                nullable: true
              situacao:
                type: string
                nullable: true
                enum:
                - EXCLUIDO
                - APROVADO
                - DISPENSADO
                description: 'Situação académica do estudante na disciplina (null/enquanto os

                  pesos contínuos não somarem 100% ou faltarem notas — "em aberto").

                  Estudante DISPENSADO não aceita nota de

                  exame/recorrência (409 STUDENT_DISPENSADO).

                  '
              state:
                type: string
                nullable: true
                description: Estado académico autoritativo (AcademicState) — o mesmo de FinalGradeDto.state.
    SubjectBoard:
      type: object
      description: 'Quadro disciplinar (um por disciplina) para dispensa, exame normal e

        recorrência: regras configuradas, épocas activas, contadores por estado

        e uma linha por estudante com espaços de exame/recorrência.

        '
      properties:
        rules:
          type: object
          properties:
            subjectId:
              type: string
            subjectCode:
              type: string
            subjectName:
              type: string
            requiredTestCount:
              type: integer
              nullable: true
              description: N.º de testes exigidos para acionar a situação; null = regra de 100% do peso.
            recurrenceMinAdmission:
              type: number
              nullable: true
              description: Mínimo de admissão (0–20) para recorrência; null = default institucional (7).
            rulesConfigured:
              type: boolean
              description: true quando requiredTestCount e recurrenceMinAdmission estão ambos preenchidos (exigido para publicar).
            published:
              type: boolean
            publishedAt:
              type: string
              format: date-time
              nullable: true
            hasExamEpoch:
              type: boolean
            hasRecurrenceEpoch:
              type: boolean
        examAssessment:
          type: object
          nullable: true
          properties:
            id:
              type: string
            title:
              type: string
            gradingMode:
              type: string
            maxScore:
              type: number
        recurrenceAssessment:
          type: object
          nullable: true
          properties:
            id:
              type: string
            title:
              type: string
            gradingMode:
              type: string
            maxScore:
              type: number
        counters:
          type: object
          description: Contagem de estudantes por estado (total + cada AcademicState).
          properties:
            total:
              type: integer
            pendentes:
              type: integer
            dispensados:
              type: integer
            excluidos:
              type: integer
            admitidosExame:
              type: integer
            aprovadosExame:
              type: integer
            reprovadosExame:
              type: integer
            admitidosRecorrencia:
              type: integer
            elegiveisRecorrencia:
              type: integer
            aprovadosRecorrencia:
              type: integer
            reprovadosRecorrencia:
              type: integer
            naoElegiveis:
              type: integer
            emRevisao:
              type: integer
        entries:
          type: array
          items:
            type: object
            properties:
              studentProfileId:
                type: string
              studentNumber:
                type: string
              fullName:
                type: string
              continuous:
                type: array
                items:
                  type: object
                  properties:
                    assessmentId:
                      type: string
                    title:
                      type: string
                    weight:
                      type: number
                    value:
                      type: number
                      nullable: true
              admissionGrade:
                type: number
                nullable: true
              admissionPercent:
                type: number
                nullable: true
              complete:
                type: boolean
              state:
                type: string
                description: AcademicState calculado no backend.
              stateReason:
                type: string
                nullable: true
              status:
                type: string
                nullable: true
                description: Situação legada (compatibilidade).
              exam:
                $ref: '#/components/schemas/ExamSlot'
              recurrence:
                $ref: '#/components/schemas/RecurrenceSlot'
              finalGrade:
                type: number
                nullable: true
              finalPercent:
                type: number
                nullable: true
    ExamSlot:
      type: object
      description: Espaço de exame normal de um estudante.
      properties:
        assessmentId:
          type: string
          nullable: true
        grade:
          type: number
          nullable: true
        valuePercent:
          type: number
          nullable: true
        comment:
          type: string
          nullable: true
        editable:
          type: boolean
          description: false quando o estado impede lançamento (DISPENSADO/EXCLUIDO).
        blockedReason:
          type: string
          nullable: true
    RecurrenceSlot:
      type: object
      description: Espaço de recorrência de um estudante.
      properties:
        assessmentId:
          type: string
          nullable: true
        grade:
          type: number
          nullable: true
        valuePercent:
          type: number
          nullable: true
        comment:
          type: string
          nullable: true
        asterisk:
          type: boolean
          description: true quando APROVADO_EXAME (UI mostra `*`; nunca guardado na BD).
        editable:
          type: boolean
          description: false quando o estado não admite recorrência.
        blockedReason:
          type: string
          nullable: true
    SetSubjectRulesRequest:
