  /assessments/subject/{subjectId}/exemptions:
    post:
      tags:
      - Assessments
      summary: Dispensa manual de estudante na disciplina (ao critério do docente)
      description: 'Roles TEACHER (disciplina leccionada), COORDINATOR, ADMIN. Dispensa

        imposta pelo docente/coordenacao sobrepoe a regra automatica

        (admissao >= 14): o estado do estudante passa a DISPENSADO

        ("Dispensado pelo docente"), sem exame nem recorrencia, e a nota final

        passa a ser apenas a admissao. Audita SUBJECT_EXEMPTION_SET /

        SUBJECT_EXEMPTION_REMOVED.

        '
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - studentId
              - exempted
              properties:
                studentId:
                  type: string
                exempted:
                  type: boolean
                  description: true = dispensar; false = anular dispensa
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '200':
          description: Dispensa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subjectId:
                        type: string
                      studentId:
                        type: string
                      exempted:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Corpo invalido
        '401':
          description: Nao autenticado
        '403':
          description: Role sem permissao ou disciplina de outro docente
        '404':
          description: Disciplina ou estudante nao encontrado
        '409':
          description: Estudante fora do curso (STUDENT_COURSE_MISMATCH) ou dispensa inexistente ao anular (EXEMPTION_NOT_FOUND)
  /assessments/{id}:
    get:
      tags:
      - Assessments
      summary: Obter avaliação
      description: Roles TEACHER (apenas as que criou), COORDINATOR, ADMIN. Violação de posse → 403.
      parameters:
